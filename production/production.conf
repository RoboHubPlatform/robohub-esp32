# production.conf — the Kconfig fragment that asks for a production build.
#
# Append it to a project's configuration (project.conf), or set the one symbol
# yourself. It is off by default everywhere. Building with it burns nothing;
# the irreversible steps are listed and confirmed by `rho flash --production`
# (see the JSON plan beside this file and docs/index.md, "Production").
CONFIG_RH_PRODUCTION=y
