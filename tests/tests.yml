# robohub-esp32's host tests, declared: the parts of the platform that need no
# peripheral, built and run on the machine doing the build by the ctest kind.
name: robohub-esp32
suites:
  - name: unit
    kind: ctest
    tags: [unit, host]
    ctest: {}

  # The two-slot layout of a development build (ESP-0009): the configuration
  # fragment, which builds use it, ESP-IDF's table laid out as ESP-IDF lays it
  # out (NVS where it was, ota_0 where the flash writes the program, both slots in
  # 4 MB) and the board's flash. Reads files only.
  # @verifies ESP-0009
  - name: ota-layout
    kind: command
    tags: [unit, host]
    command: [python3, tests/ota_layout_test.py]

  # The health contracts and the keystore on a board (ESP-0007, ESP-0011):
  # examples/c/health_check walks a LOLIN32 Lite through a watchdog reset, a
  # recorded panic and a fed watchdog, with a key held in NVS across each reset,
  # and says "health-check: passed"; health_check.py builds, flashes and reads it.
  # The build runs here; the board run is declared skipped until one is on the
  # bench.
  - name: health-check-builds
    kind: build
    tags: [smoke, software, health]
    build:
      project: examples/c/health_check
      target: lolin32-lite

  # @verifies ESP-0007, ESP-0011
  - name: health-on-target
    kind: command
    command: [python3, examples/c/health_check/health_check.py]
    tags: [on-target, esp32, health]
    status: skip
    reason: needs a LOLIN32 Lite on USB (ESP32_PORT); prints "OK" when the health contracts and the keystore held
