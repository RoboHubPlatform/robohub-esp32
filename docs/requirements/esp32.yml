# What the ESP32 platform gives RoboHub: the robohub-common contracts through
# ESP-IDF, the LOLIN32 Lite's board facts, flashing with esptool, the device
# keystore in NVS, the nonce source and the production preset. Written in the R5
# backfill from the documentation, the changelog, the code and an example build;
# proposed until the maintainer approves them. The subsystems are in flash.yml,
# keystore.yml and production.yml.
level: NODE
prefix: ESP
title: ESP32 platform
requirements:
  - id: ESP-0001
    title: The ESP32 answers the HAL contracts through ESP-IDF
    statement: >
      The platform shall implement the robohub-common contracts for GPIO, I2C,
      SPI, UART, timer and RS485 with ESP-IDF, each compiled only when its
      RH_HAL_<NAME> symbol is set, and the LOLIN32 Lite shall register
      `user_led` (GPIO5, lit when low) and `system_timer`.
    rationale: A device program is written against the contracts once; the platform is what makes it run on an ESP32.
    satisfies: [SYS-0046]
    status: proposed
    verification: demonstration
    owner: maintainer
    changed: 2026-11-19
    tags: [hal]

  - id: ESP-0002
    title: The LOLIN32 Lite declares the facts a build and a planner read
    statement: >
      The lolin32-lite board shall declare the ESP32 (LX6) with the compiler
      xtensa-esp32-elf-gcc and the ESP-IDF prelude, its LED and UART0 pins, its
      esptool flash command, and the roles relay, node and edge — not gateway,
      not host — with the links `uart console usb wifi socket`, only the buses
      the platform has a HAL for (`uart usb i2c spi gpio`), and a flash
      deployment for the `xtensa` arch selected by
      CONFIG_RH_BOARD_LOLIN32_LITE=y.
    rationale: The keeper's Mesh planner offers the board as a node or relay, never as a host gateway, from its manifest alone.
    satisfies: [SYS-0042]
    status: proposed
    verification: inspection
    owner: maintainer
    changed: 2026-11-19
    tags: [board, planner]

  - id: ESP-0003
    title: An ESP32 is flashed from the build's own offsets
    statement: >
      `rho flash -target lolin32-lite <elf>` shall write the bootloader, the
      partition table and the application at the offsets the ESP-IDF build
      recorded in `flash_args`, over the serial line named by ESP32_PORT
      (/dev/ttyUSB0 by default) at ESP32_BAUD (115200), resetting into download
      mode unless ESP32_BEFORE says otherwise.
    rationale: Three binaries at offsets the partition table decided cannot be written from a command line the toolchain invents.
    satisfies: [SYS-0049]
    status: proposed
    verification: demonstration
    owner: maintainer
    changed: 2026-11-19
    tags: [flash]

  - id: ESP-0004
    title: A rotated board key is kept in NVS
    statement: >
      The platform shall keep the rotated device key of robohub/keystore.h in
      NVS, so that a key stored after a rotation is the key loaded after the next
      reset, and every program linked with the platform shall use this store
      rather than robohub-common's "no store" default.
    rationale: A key rotated without a cable must still be the key after a power cut.
    satisfies: [SYS-0022]
    decided_by: [ADR-0001]
    status: proposed
    verification: inspection
    owner: maintainer
    changed: 2026-11-19
    tags: [keystore, key-rotation]

  - id: ESP-0005
    title: Nonces come from the hardware random generator
    statement: >
      robohub_platform_nonce on the ESP32 shall fill the buffer with
      esp_fill_random from the chip's RNG peripheral.
    rationale: A session's freshness rests on a nonce that never repeats, also across a reset.
    satisfies: [SYS-0020, SYS-0023]
    status: proposed
    verification: inspection
    owner: maintainer
    changed: 2026-11-19
    tags: [security, nonce]

  - id: ESP-0006
    title: A production image is signed, encrypted and burns its eFuses only when confirmed
    statement: >
      A build with CONFIG_RH_PRODUCTION=y shall produce a secure-boot-v2 signed
      image with flash encryption in release mode and NVS encryption, and the
      production flash shall list every eFuse that image's first boot burns and
      write it only through `rho flash --production` after the board's name is
      typed.
    rationale: The keystore in NVS is plain text on flash without encryption; burning eFuses by accident must not be possible.
    satisfies: [SYS-0043, SYS-0044]
    status: proposed
    verification: inspection
    owner: maintainer
    changed: 2026-11-19
    tags: [production, security, secure-boot]

  - id: ESP-0007
    title: The ESP32 platform implements the health contracts
    statement: >
      The platform shall implement robohub-common's watchdog, reset-reason and
      fault-record contracts (COMM-0010..0012) on its hardware — the task and interrupt watchdogs, `esp_reset_reason()`, and RTC memory that a reset keeps (`RTC_NOINIT`) for the fault record and boot count — and
      a host or on-target test shall check each.
    rationale: The node runtime's watchdog policy and health report (RNODE-0008) run on every board RoboHub supports.
    satisfies: [SYS-0070, SYS-0072]
    decided_by: [robohub:ADR-0021]
    status: approved
    verification: test
    owner: maintainer
    changed: 2026-11-20
    tags: [health, watchdog, platform]

  - id: ESP-0008
    title: The ESP32 implements the update slot with ESP-IDF's OTA slots and rollback
    statement: >
      The platform shall implement robohub-common's update slot contract
      (COMM-0013, COMM-0014) with ESP-IDF's OTA: write an image to the OTA slot
      not running (`esp_ota_begin/write/end`), boot it once by naming it for the
      next boot and restarting, say an image is pending while the running slot is
      `PENDING_VERIFY`, confirm it (`esp_ota_mark_app_valid_cancel_rollback`),
      give it up (`esp_ota_mark_app_invalid_rollback_and_reboot`), keep the
      update's id, versions and outcome — kept or rolled back — and the board's
      security version in NVS, and answer not updatable on a board without two
      OTA slots; and an on-target test shall update a LOLIN32 Lite, confirm one
      image and roll back another.
    rationale: Each chip's own A/B mechanism behind one interface (robohub ADR-0021); the ESP32's is ESP-IDF's OTA slots and application rollback (robohub ADR-0024).
    satisfies: [SYS-0072]
    decided_by: [robohub:ADR-0024, robohub:ADR-0021]
    status: approved
    verification: test
    owner: maintainer
    changed: 2026-11-20
    tags: [updates, ota]

  - id: ESP-0009
    title: An ESP32 build makes a two-slot first flash and an update image
    statement: >
      The platform's development builds shall use the two-OTA-slot partition
      table with NVS at 0x9000 (24 kB) as before, set application rollback with
      confirmation by the application, provide a first flash that writes the
      bootloader, the partition table, an erased `otadata` and the program into
      `ota_0`, and keep the program's application image (`.bin`) for an update
      over the link; production builds shall keep their own table.
    rationale: The layout and the confirmation are what ADR-0024 decided; a board moves with its next USB flash, and production boards stay flash-only for now.
    satisfies: [SYS-0072]
    decided_by: [robohub:ADR-0024]
    status: approved
    verification: test
    owner: maintainer
    changed: 2026-11-20
    tags: [updates, build, ota]

  - id: ESP-0010
    title: The ESP32 implements the network contract with a Wi-Fi station and lwIP sockets
    statement: >
      The platform shall implement robohub-common's network contract
      (`robohub/net.h`) on ESP-IDF: join a Wi-Fi network as a station, report its
      status and address, and open, connect, send on, receive from with a timeout,
      and close TCP sockets through lwIP; the join shall return within its
      timeout without blocking the caller's loop longer than the core's watchdog
      allows.
    rationale: The board offers Wi-Fi in Mesh, and a node links to its parent over it as a Pico does (robohub ADR-0025, 4).
    satisfies: [SYS-0072]
    decided_by: [robohub:ADR-0025]
    status: approved
    verification: test
    owner: maintainer
    changed: 2026-11-21
    tags: [network, wifi]

  - id: ESP-0011
    title: The ESP32's health and keystore are checked on the board
    statement: >
      An example (`examples/c/health_check`) shall walk a LOLIN32 Lite through a
      watchdog reset, a recorded fault and a fed watchdog (ESP-0007), and store a
      key, reset, load the same key, store a second and load it (the keystore in
      NVS), printing `health-check: passed`; it shall be built by the tests and
      declared skipped until run on a board.
    rationale: The health contracts and the keystore are only shown to hold on the hardware they run on (robohub ADR-0025, 5).
    satisfies: [SYS-0070, SYS-0072]
    decided_by: [robohub:ADR-0025]
    status: approved
    verification: test
    owner: maintainer
    changed: 2026-11-21
    tags: [health, keystore, on-target]

  - id: ESP-0012
    title: The ESP32 implements the I2C HAL on ESP-IDF's master driver and registers its bus
    statement: >
      When the I2C HAL is chosen (`CONFIG_RH_HAL_I2C`), the platform shall
      implement robohub-common's I2C HAL on ESP-IDF's I2C master driver — the bus
      made when a driver first brings it up, a device handle per address, a
      timeout on every transfer — and the LOLIN32 Lite shall register "i2c0" on
      GPIO23 (SDA) and GPIO19 (SCL), pins free of its LED, its console and its
      strapping pins.
    rationale: The I2C HAL was a stub, so no I2C driver worked on the board; the settlement node's sensor is I2C (robohub ADR-0026).
    satisfies: [SYS-0072]
    decided_by: [robohub:ADR-0026]
    status: approved
    verification: test
    owner: maintainer
    changed: 2026-11-21
    tags: [i2c, hal]
