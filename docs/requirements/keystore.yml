# The device keystore in NVS (src/platform/esp_keystore.c,
# boards/lolin32-lite/component.cmake). Proposed until the maintainer approves
# them.
level: SUB
prefix: ESP-KEY
title: ESP32 keystore
requirements:
  - id: ESP-KEY-0001
    title: The keystore is two blobs in the rh_keys namespace
    statement: >
      The keystore shall hold the A/B records of robohub/keystore_core.h as NVS
      blobs `a` and `b` in namespace `rh_keys`, committing every write and
      erase, and a blob whose stored size differs from the record's shall read as
      absent.
    rationale: NVS writes atomically; the A/B records keep the rules every platform chooses a key by.
    satisfies: [ESP-0004]
    decided_by: [ADR-0001]
    status: proposed
    verification: inspection
    owner: maintainer
    changed: 2026-11-19
    tags: [keystore, nvs]

  - id: ESP-KEY-0002
    title: NVS is initialised but never erased by the keystore
    statement: >
      When NVS is not initialised the first keystore call shall initialise it,
      and when initialising needs NVS erased (no free pages or a newer format)
      the keystore shall report failure and leave the partition as it is.
    rationale: Erasing NVS would throw away every stored key with the rest of the partition.
    satisfies: [ESP-0004]
    decided_by: [ADR-0001]
    status: proposed
    verification: inspection
    owner: maintainer
    changed: 2026-11-19
    tags: [keystore, nvs]

  - id: ESP-KEY-0003
    title: The NVS keystore is always the one linked
    statement: >
      The board's component shall name rh_keystore_load, rh_keystore_store and
      rh_keystore_platform as undefined symbols on the link, so the NVS
      implementation is linked whatever order the archives come in.
    rationale: A board that silently linked the default would answer a rotation "cannot rotate".
    satisfies: [ESP-0004]
    status: proposed
    verification: inspection
    owner: maintainer
    changed: 2026-11-19
    tags: [keystore, linker]
