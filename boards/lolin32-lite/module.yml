#
# lolin32-lite — WEMOS LOLIN32 Lite board support.
#
# @project RoboHub Platform
# @license MIT
#

module:
  name: lolin32-lite
  id: robohub.platform-board.lolin32-lite
  previous_ids:
    - robohub-esp32.boards.lolin32-lite
  type: platform-board
  version: 0.1.0
  description: >
    Board support package for the WEMOS LOLIN32 Lite (ESP32-WROOM-32, 4 MB
    flash, CH340 USB-serial).

  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-10-07"

hardware:
  presets: presets/
  target: target.json

vendor:
  dir: ../../vendor
  repos:
    - name: esp-idf
      path: esp-idf
      git: https://github.com/espressif/esp-idf.git
      branch: master

build:
  language: c
  standard: c11
  include_dirs:
    - bsp/

config:
  dialect: linux
  kconfig_fragments:
    - Kconfig

# What this board can be in a deployment. It has the radio and the buses for a
# node or a relay; the gateway role is the Linux host's. `buses` names only what
# the platform has a HAL for (src/hal): the chip has 1-Wire-capable pins, ADCs
# and LEDC PWM, but until robohub-esp32 implements those contracts Mesh must not
# offer a driver that needs them.
capabilities:
  gateway: false
  relay: true
  node: true
  edge: true
  host: false
  wireless: true
  ethernet: false
  links: "uart console usb wifi socket"
  buses: "uart usb i2c spi gpio"
  deploy: "flash"

# How a deployment reaches this board: it is flashed, and its image is built for
# the Xtensa LX6 core it carries (the `xtensa` arch of targets/). Mesh reads
# `arch` only for a board it deploys a gateway to, as the GOARCH of that build;
# this board is never one, so the value is a fact, not a build input. The target
# name is the board's own `module.name`.
deployment:
  kconfig: "CONFIG_RH_BOARD_LOLIN32_LITE=y"
  method: "flash"
  arch: "xtensa"

package:
  kind: library
  binary: false

board:
  designation: LOLIN32_LITE
  summary: "A LOLIN32 Lite: ESP32 with WiFi and a CH340 serial link."
  mcu: ESP32
  family: ESP32
  core: LX6
  preset: esp32
  target: esp32
  connectors:
    - name: GPIO
      pins: 1-39
    - name: BATTERY
    - name: USB_SERIAL
  programmer:
    tool: esptool
    interface: serial
    protocol: esp32-rom
  flash:
    tool: esptool
    command: "esptool --chip esp32 --port {env:ESP32_PORT:-/dev/ttyUSB0} --baud {env:ESP32_BAUD:-115200} --before {env:ESP32_BEFORE:-default-reset} --after {env:ESP32_AFTER:-hard-reset} write-flash @flash_args {binary}"
    # The flash above writes the two-OTA-slot layout of a development build —
    # ESP-IDF's flash_args carry the bootloader, the table, the initial otadata
    # and the program into ota_0 (ESP-0009, robohub ADR-0024) — so Mesh records a
    # board it flashed as one that takes updates over the link.
    ab: true
  pins:
    user_led:
      gpio: 5
      active_high: false
    uart0_tx:
      gpio: 1
    uart0_rx:
      gpio: 3
    boot_button:
      gpio: 0
      active_high: false
  peripherals:
    - name: uart0
      kind: uart
    - name: uart2
      kind: uart
    - name: i2c0
      kind: i2c
    - name: spi0
      kind: spi
metadata:
  tags:
    - board
    - esp32
    - lolin32
    - robohub
  stability: experimental
  visibility: public
